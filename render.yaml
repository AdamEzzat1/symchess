# Render Blueprint: one free web service built from the Dockerfile.
# Render supplies PORT; the engine reads it and serves the site and /ws on it.
services:
  - type: web
    name: symchess
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      # The free instance has a tenth of a CPU and searches run one at a
      # time, so keep the table small.
      - key: SYMCHESS_MAX_SESSIONS
        value: "4"
